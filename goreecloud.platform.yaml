schema_version: '0.2'

component:
  type: service
  id: goreecloud-cast
  product_name: GoreeCloud Cast
  repository: GoreeCloud/goreecloud-cast

lifecycle: development
version: '0.2.0'

supported_platforms: []

api:
  versions: []
  endpoints: []

platform_systems:
  manager:
    result: applicable-blocked
    version: null
    evidence:
      - README.md
      - SPECIFICATIONS.md
    notes: Manager administration, inventory, policy, health, and operational visibility are planned, but no accepted Manager runtime producer or consumer integration exists.
  privacy_shield:
    result: applicable-blocked
    version: null
    evidence:
      - src/state_capsule.rs
      - src/handoff.rs
      - PRIVACY POLICY.md
    notes: The Phase 0 core consumes a bounded privacy decision and filters State Capsule entries, but no authenticated Privacy Shield adapter, durable authorization, revocation, or runtime acceptance exists.
  wardveil_security:
    result: applicable-blocked
    version: null
    evidence:
      - src/handoff.rs
      - SECURITY.md
    notes: The Phase 0 core fails closed on denied or unknown security decisions and now includes source-level handshake/command boundaries, but no authenticated Wardveil runtime integration, posture evaluation, threat monitoring, or production security acceptance exists.
  everkeep:
    result: applicable-blocked
    version: null
    evidence:
      - FEATURE-ROADMAP.md
      - SPECIFICATIONS.md
    notes: Session continuity and recoverable configuration are planned, but no accepted Everkeep backup, restore, migration, or recovery integration exists.
  glaze_ui:
    result: applicable-migration-required
    version: null
    evidence:
      - BRANDING.md
      - USER-MANUAL.md
    notes: GoreeCloud Cast will require current Stable Glaze UI for user-facing controller and receiver surfaces; no UI implementation or product-specific visual/accessibility acceptance exists yet.
  mesh:
    result: applicable-blocked
    version: null
    evidence:
      - FEATURE-ROADMAP.md
      - SPECIFICATIONS.md
    notes: Mesh capability discovery and ecosystem coordination are applicable, but no registration, discovery, event, dependency, or runtime integration exists. The local deterministic protocol and discovery models do not establish Mesh conformance.
    capabilities: []
    dependencies: []
    published_events: []
    consumed_events: []
  identity:
    result: applicable-blocked
    version: null
    evidence:
      - src/identity.rs
      - src/auth.rs
      - src/handshake.rs
      - SECURITY.md
      - tests/phase0_handshake.rs
    notes: The core now defines bounded identity/trust types plus device-identity signer/verifier, pairing-authorizer, and session-credential authority interfaces, and the in-memory harness fails closed when identity verification is rejected. No production cryptographic provider, live GoreeCloud Identity adapter, credential issuance service, trust persistence, revocation, or runtime acceptance exists.

health:
  health_endpoint: null
  readiness_endpoint: null

continuity:
  backup:
    required: true
    requirements:
      - Preserve only approved durable Cast trust, policy, group, and recovery state through accepted Everkeep-aligned backup scope when those stores are implemented.
      - Exclude transient session secrets and unrelated user content from ordinary backup payloads.
  restore:
    required: true
    requirements:
      - Validate clean restoration of approved durable Cast state without reviving revoked trust or expired credentials before production dependence.
  export:
    required: true
    requirements:
      - Provide documented export for user-owned Cast configuration and trusted-device metadata where policy permits, excluding secrets and security evidence.
  portability:
    required: true
    requirements:
      - Keep Cast session, capability, receiver, protocol, and portable configuration contracts independently documented and versioned.

external_dependencies: []

compatibility:
  platform_contract: '0.2'
  glaze_ui_required: '1.5.0'
  requires:
    - goreecloud-platform-contract==0.2
    - glaze-ui==1.5.0
  provides:
    - cast-core-phase0
    - cast-handoff-preflight-development
    - cast-auth-adapter-contracts-development
    - cast-protocol-0.2-development
    - cast-command-sequencing-development
    - cast-in-memory-handshake-development

evidence:
  acceptance_tests:
    - id: cast-core-contracts-20260916
      category: core
      path: tests/core_contracts.rs
      revision: f165832a3e2e0be546415672a916f706e21890b8
      result: passed
      observed_at: '2026-09-16T22:05:17Z'
      notes: GoreeCloud Cast Core CI run 35155854625 passed cargo fmt --check and cargo test --all-targets for the initial bounded Phase 0 core on the exact source revision.
    - id: cast-phase0-handshake-protocol-20260916
      category: core
      path: tests/phase0_handshake.rs
      revision: c421ce127059a0a1cd8ba33740e9c2188bbf58a3
      result: passed
      observed_at: '2026-09-16T22:19:33Z'
      notes: GoreeCloud Cast Core CI run 35157077714 passed cargo fmt --check and cargo test --all-targets for identity/pairing/session-credential adapter contracts, deterministic protocol serialization, authenticated discovery-detail gating, command ordering/idempotency, and the in-memory handshake harness.
  release: []

conformance:
  status: nonconformant
  validated_at: null
  evidence:
    - README.md
    - SPECIFICATIONS.md
    - SECURITY.md
    - PRIVACY POLICY.md
    - docs/architecture/phase-0-core.md
    - src/auth.rs
    - src/command.rs
    - src/discovery.rs
    - src/handoff.rs
    - src/handshake.rs
    - src/protocol.rs
    - src/state_capsule.rs
    - tests/core_contracts.rs
    - tests/phase0_handshake.rs
  blockers:
    - Exact-source Development CI passes for the bounded Phase 0 core and in-memory handshake/protocol increment, but this does not establish runtime, platform-integration, production, release, or Stable acceptance.
    - Identity/pairing/session-credential interfaces now exist, but no production cryptographic device identity provider, secure pairing implementation, expiring/revocable session credential provider, encryption, authenticated network transport, or durable trust store exists.
    - Source-level command ordering and idempotency exist, but complete replay protection across real transports, reconnect, recovery, and malicious peers is not established.
    - Manager, Privacy Shield, Wardveil Security, Everkeep, Mesh, and Identity runtime integrations remain unaccepted.
    - Glaze UI 1.5.0 is the current required Stable consumer target, but no Cast UI implementation or product-specific acceptance evidence exists.
    - No controller or receiver runtime, network transport, media playback, streaming, capture, grouping, guest, or remote Cast implementation exists.
    - No health/readiness endpoints, deployment, production acceptance, release evidence, or Stable qualification exists.
    - GoreeCloud Sync remains separately governed; no Cast synchronization integration is accepted or required for basic local operation.
