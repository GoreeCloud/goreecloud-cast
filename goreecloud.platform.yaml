  wardveil_security:
    result: applicable-blocked
    version: null
    evidence:
      - src/handoff.rs
      - SECURITY.md
    notes: The Phase 0 core fails closed on denied or unknown security decisions, but no authenticated Wardveil runtime integration, posture evaluation, threat monitoring, or production security acceptance exists.
  everkeep:
    result: applicable-blocked
    version: null
    evidence:
      - FEATURE-ROADMAP.md
      - SPECIFICATIONS.md
