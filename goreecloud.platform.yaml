  glaze_ui:
    result: applicable-migration-required
    version: null
    evidence:
      - BRANDING.md
      - USER-MANUAL.md
    notes: GoreeCloud Cast will require current Stable Glaze UI for user-facing controller and receiver surfaces; no UI implementation or product-specific visual/accessibility acceptance exists yet.
  mesh:
