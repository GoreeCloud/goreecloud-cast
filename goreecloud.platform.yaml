health:
  health_endpoint: null
  readiness_endpoint: null

continuity:
  backup:
    required: true
    requirements:
      - Preserve only approved durable Cast trust, policy, group, and recovery state through accepted Everkeep-aligned backup scope when those stores are implemented.
      - Exclude transient session secrets and unrelated user content from ordinary backup payloads.
  restore:
    required: true
    requirements:
      - Validate clean restoration of approved durable Cast state without reviving revoked trust or expired credentials before production dependence.
  export:
    required: true
    requirements:
      - Provide documented export for user-owned Cast configuration and trusted-device metadata where policy permits, excluding secrets and security evidence.
  portability:
    required: true
    requirements:
      - Keep Cast session, capability, receiver, and portable configuration contracts independently documented and versioned.

external_dependencies: []

compatibility:
  platform_contract: '0.2'
  glaze_ui_required: '1.5.0'
  requires:
    - goreecloud-platform-contract==0.2
    - glaze-ui==1.5.0
  provides:
    - cast-core-phase0
    - cast-handoff-preflight-development

evidence:
  acceptance_tests:
    - id: cast-core-contracts-20260916
      category: core
      path: tests/core_contracts.rs
      revision: f165832a3e2e0be546415672a916f706e21890b8
      result: passed
      observed_at: '2026-09-16T22:05:17Z'
      notes: GoreeCloud Cast Core CI run 35155854625 passed cargo fmt --check and cargo test --all-targets for the bounded Phase 0 core on the exact source revision.
  release: []

conformance:
  status: nonconformant
  validated_at: null
  evidence:
    - README.md
    - SPECIFICATIONS.md
    - SECURITY.md
    - PRIVACY POLICY.md
    - docs/architecture/phase-0-core.md
    - src/handoff.rs
    - src/state_capsule.rs
    - tests/core_contracts.rs
  blockers:
    - Exact-source Development CI passes for the bounded Phase 0 core, but this does not establish runtime, platform-integration, production, release, or Stable acceptance.
    - No cryptographic device identity, secure pairing, session credential derivation, encryption, replay protection, or durable trust store exists.
    - Manager, Privacy Shield, Wardveil Security, Everkeep, Mesh, and Identity runtime integrations remain unaccepted.
    - Glaze UI 1.5.0 is the current required Stable consumer target, but no Cast UI implementation or product-specific acceptance evidence exists.
    - No controller or receiver runtime, network transport, media playback, streaming, capture, grouping, guest, or remote Cast implementation exists.
    - No health/readiness endpoints, deployment, production acceptance, release evidence, or Stable qualification exists.
    - GoreeCloud Sync remains separately governed; no Cast synchronization integration is accepted or required for basic local operation.
